<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etch-a-Sketch</title>
    <link rel="stylesheet" href="style.css">
    
</head>
<body>

    <div class="controls">
        <button id = "sizeButton">Grid Number</button>
        <label for = "colorPicker">Colour Grid</label>

        <input type = "color" id="colorPicker" value="#123456">

        <button id = "blackButton">Default Grid</button>
        <button id = "colorButton">Rainbow Grid</button>
        <button id = "eraseButton">Erase Grid</button>
        <button id = "clearButton">Clear Grid</button>
    </div>

    <div id="container" class="square"><h1>Choose Your Grid Size</h1></div>
    <script src="sketch.js"></script>
</body>
</html>
